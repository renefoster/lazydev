name: CI

on:
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  # The job name "check" is what the branch rulesets will require.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint HTML
        run: npx --yes htmlhint@1 index.html
